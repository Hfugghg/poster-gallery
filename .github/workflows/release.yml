name: Release component package

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package-kit/package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} must match package version v${version}.`);
          }
          NODE
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and build application
        run: |
          npm run check
          npm run build
      - name: Build and verify component
        run: |
          node scripts/build-package.mjs
          node scripts/check-package.mjs
      - name: Package lightweight release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/package-release.mjs
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: poster-frame-${{ github.ref_name }}
          path: |
            releases/*.tgz
            releases/*.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(releases/*.tgz releases/*.zip)
          if [[ ${#assets[@]} -ne 2 ]]; then
            echo "Expected exactly one npm archive and one source ZIP."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
