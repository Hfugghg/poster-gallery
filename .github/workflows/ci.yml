name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck application
        run: npm run check
      - name: Build application
        run: npm run build
      - name: Build reusable component
        run: node scripts/build-package.mjs
      - name: Verify reusable package
        run: node scripts/check-package.mjs
      - name: Verify lightweight release packaging
        run: node scripts/package-release.mjs
